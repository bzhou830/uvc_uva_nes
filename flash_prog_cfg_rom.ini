; ROM 分区烧录配置（仅烧游戏 ROM，不碰固件）
; 用法：板子进下载模式后执行
;   BLFlashCommand.exe --port COM6 --config flash_prog_cfg_rom.ini --chipname bl616 write_flash_files
; 或跨平台：python tools/flash_rom.py <game.nes>
;
; address 必须与 infones_port.c 的 NES_ROM_FLASH_OFFSET (0x00100000) 一致。
; erase=1 仅擦除该文件覆盖的扇区，不会动 0x0 的固件。
; filedir 改成你要烧的 .nes 绝对路径（BLFlashCommand 直接按字节烧，扩展名无所谓）。

[FW]
filedir = C:/Users/lx/Desktop/nofrendo/src/2048.nes
address = 0x00100000
erase = 1
