<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>BL616 NES Pad (WebHID)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; }
  button { font-size: 1rem; padding: .5rem 1rem; margin: .25rem; }
  #log { white-space: pre-wrap; background: #111; color: #0f0; padding: 1rem; height: 160px; overflow: auto; }
  .pad { display: grid; grid-template-columns: repeat(3, 60px); gap: 6px; margin-top: 1rem; }
  .pad button { height: 56px; }
  .on { background: #4caf50; color: #fff; }
</style>
</head>
<body>
<h2>BL616 NES 手柄转发 (WebHID)</h2>
<p>用 Chrome 打开本页（需通过 http://localhost 或 https 提供安全上下文，file:// 不可用 WebHID）。
   点“连接设备”，选 VID/PID=ABCD/1234 的 HID，然后用键盘或手柄操作。<br>
   键盘：<b>W/A/S/D</b>=上/左/下/右，<b>J</b>=A，<b>K</b>=B，<b>空格</b>=Select，<b>Enter</b>=Start</p>
<button id="connect">连接设备</button>
<button id="disconnect">断开</button>
<div id="log">日志：</div>

<div class="pad">
  <span></span><button data-bit="16">↑</button><span></span>
  <button data-bit="64">←</button><span></span><button data-bit="128">→</button>
  <span></span><button data-bit="32">↓</button><span></span>
  <button data-bit="4">Sel</button><button data-bit="8">Sta</button><span></span>
  <button data-bit="1">A</button><span></span><button data-bit="2">B</button>
</div>

<script>
const VID = 0xABCD, PID = 0x1234, REPORT_ID = 1;
let device = null;
const log = (m) => { document.getElementById('log').textContent += '\n' + m; };

function sendPad(pad) {
  if (!device) return;
  // Out 端点 / sendReport：首字节为 report id，次字节为 NES 位
  device.sendReport(REPORT_ID, new Uint8Array([pad])).catch(e => log('发送失败: ' + e));
}

// 键盘映射：WASD=上左下右，J=A，K=B，空格=Select，Enter=Start
const KEY_MAP = {w:16,W:16,a:64,A:64,s:32,S:32,d:128,D:128,
                 j:1,J:1,k:2,K:2,' ':4,Enter:8};
const down = new Set();
function setPad(bit, on) {
  down[on ? 'add' : 'delete'](bit);
  const btn = document.querySelector(`.pad button[data-bit="${bit}"]`);
  if (btn) btn.classList.toggle('on', on);
}
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.key in KEY_MAP) { setPad(KEY_MAP[e.key], true); e.preventDefault(); pushPad(); }
});
addEventListener('keyup', e => {
  if (e.key in KEY_MAP) { setPad(KEY_MAP[e.key], false); pushPad(); }
});
addEventListener('blur', () => { down.clear(); syncAllBtns(); pushPad(); }); // 切走窗口时松开所有键
function syncAllBtns() {
  document.querySelectorAll('.pad button').forEach(b => b.classList.toggle('on', down.has(+b.dataset.bit)));
}

// 屏幕按钮（按下/松开）
document.querySelectorAll('.pad button').forEach(btn => {
  const bit = +btn.dataset.bit;
  btn.addEventListener('pointerdown', () => { down.add(bit); btn.classList.add('on'); pushPad(); });
  btn.addEventListener('pointerup',   () => { down.delete(bit); btn.classList.remove('on'); pushPad(); });
  btn.addEventListener('pointerleave',() => { down.delete(bit); btn.classList.remove('on'); pushPad(); });
});

function pushPad() {
  let p = 0; for (const b of down) p |= b; sendPad(p);
}

// 手柄（Gamepad API）
let lastPad = 0;
function pollGamepad() {
  const gp = navigator.getGamepads ? navigator.getGamepads()[0] : null;
  if (gp) {
    let p = 0;
    const ax = gp.axes, h = gp.buttons;
    if (ax[0] < -0.5) p |= 64; if (ax[0] > 0.5) p |= 128;
    if (ax[1] < -0.5) p |= 16; if (ax[1] > 0.5) p |= 32;
    if (h[0] && h[0].pressed) p |= 1;   // A
    if (h[1] && h[1].pressed) p |= 2;   // B
    if (h[6] && h[6].pressed) p |= 4;   // Back/Select
    if (h[7] && h[7].pressed) p |= 8;   // Start
    if (p !== lastPad) { sendPad(p); lastPad = p; }
  }
  requestAnimationFrame(pollGamepad);
}
requestAnimationFrame(pollGamepad);

document.getElementById('connect').onclick = async () => {
  try {
    const devs = await navigator.hid.requestDevice({ filters: [{ vendorId: VID, productId: PID }] });
    device = devs[0];
    await device.open();
    log('已连接: ' + device.productName);
  } catch (e) { log('连接失败: ' + e); }
};
document.getElementById('disconnect').onclick = async () => {
  if (device) { await device.close(); device = null; log('已断开'); }
};
</script>
</body>
</html>
