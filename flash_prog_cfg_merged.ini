[cfg]
# 0: no erase, 1:programmed section erase, 2: chip erase
erase = 1
# skip mode set first para is skip addr, second para is skip len, multi-segment region with ; separated
skip_mode = 0x0, 0x0
# 0: not use isp mode, #1: isp mode
boot2_isp_mode = 0
pre_program = 
pre_program_args = 

[FW]
# 合并镜像：固件(@0x0) + 目录区(@0x100000) + 各 ROM 数据(@0x101000 起)
# 由 tools/make_merged_firmware.py 生成；一次写完固件和全部游戏。
filedir = ./build/build_out/cherryusb_bl616_merged.bin
address = 0x000000
